version: 2
updates:
  # Keep GitHub Actions pinned-by-SHA references up to date. Dependabot
  # rewrites the SHA and the trailing `# vX.Y.Z` version comment together.
  # No auto-merge: every bump is reviewed before it lands (supply-chain guard).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions

  # Keep the hash-locked pre-commit version (.github/requirements/) current.
  # Dependabot regenerates the hashes in pre-commit.txt along with the bump,
  # so the pin never rots silently.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
