name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege default: jobs are read-only unless they opt into more below.
permissions:
  contents: read

jobs:
  # Fail fast if the pushed tag disagrees with package.json, so we never
  # release binaries whose baked-in version drifts from the source tree (#81).
  verify-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            echo "Fix: bump package.json to \"${TAG_VERSION}\" on main, then delete and re-push the tag."
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches package.json version ${PKG_VERSION}"

  build:
    needs: verify-version
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            smoke: true
            artifact: slackcli-linux
          - os: ubuntu-latest
            target: bun-linux-arm64
            smoke: false
            artifact: slackcli-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            smoke: false
            artifact: slackcli-macos
          - os: macos-latest
            target: bun-darwin-arm64
            smoke: true
            artifact: slackcli-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            smoke: true
            artifact: slackcli-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: Bun 1.3.12 produced corrupt macOS code signatures that
          # caused the released binary to be killed on launch on Apple
          # Silicon (issue #43, oven-sh/bun#29120). 1.4.1 is the first release
          # whose --bytecode cross-compiles to Windows x64 (#137); bytecode is
          # tied to the Bun that emits it. Bump intentionally after reviewing
          # Bun release notes.
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: bun build --compile --minify --bytecode --splitting --format=esm --target=${{ matrix.target }} --define __APP_VERSION__='"${{ steps.version.outputs.VERSION }}"' src/index.ts --outfile dist/${{ matrix.artifact }}

      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/${{ matrix.artifact }}
          codesign --verify --verbose dist/${{ matrix.artifact }}

      # Run the (signed) binary before it ships: bytecode + --splitting change
      # how modules are wired, and CI only exercises Linux x64 (#137). Skipped
      # where the target arch differs from the runner's.
      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 1
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes to the repo (creating the GitHub Release).
    permissions:
      contents: write
    # The Homebrew formula checksums are taken from the checksums.txt this job
    # generates, so update-homebrew never re-downloads and re-hashes the assets.
    outputs:
      sha_macos_x86: ${{ steps.sums.outputs.sha_macos_x86 }}
      sha_macos_arm: ${{ steps.sums.outputs.sha_macos_arm }}
      sha_linux: ${{ steps.sums.outputs.sha_linux }}
      sha_linux_arm: ${{ steps.sums.outputs.sha_linux_arm }}
      # 'true' only on the run that creates the release: the duplicate guard
      # for announce-discord (#358).
      created: ${{ steps.existing.outputs.created }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Organize artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name 'slackcli-linux' -o -name 'slackcli-linux-arm64' -o -name 'slackcli-macos' -o -name 'slackcli-macos-arm64' -o -name 'slackcli-windows.exe' \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Expose Homebrew checksums
        id: sums
        run: |
          # Exact-name match: slackcli-macos must not also match slackcli-macos-arm64.
          sha_for() { awk -v f="$1" '$2 == f { print $1 }' release/checksums.txt; }
          {
            echo "sha_macos_x86=$(sha_for slackcli-macos)"
            echo "sha_macos_arm=$(sha_for slackcli-macos-arm64)"
            echo "sha_linux=$(sha_for slackcli-linux)"
            echo "sha_linux_arm=$(sha_for slackcli-linux-arm64)"
          } >> "$GITHUB_OUTPUT"

      # Must run before the release is created. A re-run of this job finds the
      # release in place and reports created=false, so "Re-run all jobs" never
      # announces a release twice. Anything other than a clear HTTP 404 also
      # counts as not created: a missed announcement can be posted by hand, a
      # duplicate cannot be taken back.
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if out="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --silent 2>&1)"; then
            echo "Release $GITHUB_REF_NAME already exists; it will not be announced again"
            echo "created=false" >> "$GITHUB_OUTPUT"
          elif [[ "$out" == *"HTTP 404"* ]]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not tell whether release $GITHUB_REF_NAME exists; it will not be announced"
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    # No write access to THIS repo is needed; the cross-repo write to
    # homebrew-tap is authorized solely by the token in GH_TOKEN below.
    permissions:
      contents: read
    steps:
      # Mint a short-lived (≈1h) installation token from a dedicated
      # GitHub App scoped to the homebrew-tap repo only. Replaces the
      # long-lived HOMEBREW_TAP_TOKEN PAT (#52).
      - name: Mint Homebrew tap token
        id: tap_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: shaharia-lab
          repositories: homebrew-tap

      - name: Update Homebrew formulas
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          SHA_MACOS_X86: ${{ needs.release.outputs.sha_macos_x86 }}
          SHA_MACOS_ARM: ${{ needs.release.outputs.sha_macos_arm }}
          SHA_LINUX: ${{ needs.release.outputs.sha_linux }}
          SHA_LINUX_ARM: ${{ needs.release.outputs.sha_linux_arm }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          VERSION_CLASS=$(echo "$VERSION_NUM" | tr -d '.')

          # Checksums come from the release job's checksums.txt. Refuse to write
          # the tap if any is missing or malformed, so a broken formula never ships.
          for pair in SHA_MACOS_X86:slackcli-macos SHA_MACOS_ARM:slackcli-macos-arm64 \
                      SHA_LINUX:slackcli-linux SHA_LINUX_ARM:slackcli-linux-arm64; do
            var="${pair%%:*}"
            asset="${pair#*:}"
            if ! [[ "${!var}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No valid SHA256 for ${asset} in checksums.txt (${var}='${!var}')"
              exit 1
            fi
          done
          echo "SHA256 macOS x86_64: ${SHA_MACOS_X86}"
          echo "SHA256 macOS arm64: ${SHA_MACOS_ARM}"
          echo "SHA256 Linux x86_64: ${SHA_LINUX}"
          echo "SHA256 Linux arm64: ${SHA_LINUX_ARM}"

          # Main formula content
          MAIN_FORMULA="# typed: false
          # frozen_string_literal: true

          class Slackcli < Formula
            desc \"Slack CLI - Interact with Slack from command line\"
            homepage \"https://github.com/shaharia-lab/slackcli\"
            version \"${VERSION_NUM}\"
            license \"MIT\"

            on_macos do
              if Hardware::CPU.intel?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-macos\"
                sha256 \"${SHA_MACOS_X86}\"

                def install
                  bin.install \"slackcli-macos\" => \"slackcli\"
                end
              end
              if Hardware::CPU.arm?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-macos-arm64\"
                sha256 \"${SHA_MACOS_ARM}\"

                def install
                  bin.install \"slackcli-macos-arm64\" => \"slackcli\"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-linux\"
                sha256 \"${SHA_LINUX}\"

                def install
                  bin.install \"slackcli-linux\" => \"slackcli\"
                end
              end
              if Hardware::CPU.arm?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-linux-arm64\"
                sha256 \"${SHA_LINUX_ARM}\"

                def install
                  bin.install \"slackcli-linux-arm64\" => \"slackcli\"
                end
              end
            end

            test do
              system \"\#{bin}/slackcli\", \"--version\"
            end
          end"

          # Versioned formula content
          VERSIONED_FORMULA="# typed: false
          # frozen_string_literal: true

          class SlackcliAT${VERSION_CLASS} < Formula
            desc \"Slack CLI - Interact with Slack from command line\"
            homepage \"https://github.com/shaharia-lab/slackcli\"
            version \"${VERSION_NUM}\"
            license \"MIT\"

            keg_only :versioned_formula

            on_macos do
              if Hardware::CPU.intel?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-macos\"
                sha256 \"${SHA_MACOS_X86}\"

                def install
                  bin.install \"slackcli-macos\" => \"slackcli\"
                end
              end
              if Hardware::CPU.arm?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-macos-arm64\"
                sha256 \"${SHA_MACOS_ARM}\"

                def install
                  bin.install \"slackcli-macos-arm64\" => \"slackcli\"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-linux\"
                sha256 \"${SHA_LINUX}\"

                def install
                  bin.install \"slackcli-linux\" => \"slackcli\"
                end
              end
              if Hardware::CPU.arm?
                url \"https://github.com/shaharia-lab/slackcli/releases/download/${VERSION}/slackcli-linux-arm64\"
                sha256 \"${SHA_LINUX_ARM}\"

                def install
                  bin.install \"slackcli-linux-arm64\" => \"slackcli\"
                end
              end
            end

            test do
              system \"\#{bin}/slackcli\", \"--version\"
            end
          end"

          # Update main formula
          echo "Updating main formula slackcli.rb..."
          MAIN_SHA=$(gh api "repos/shaharia-lab/homebrew-tap/contents/Formula/slackcli.rb" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$MAIN_SHA" ]; then
            echo "$MAIN_FORMULA" | gh api --method PUT "repos/shaharia-lab/homebrew-tap/contents/Formula/slackcli.rb" \
              -f message="slackcli ${VERSION_NUM}" \
              -f content="$(echo "$MAIN_FORMULA" | base64 -w0)" \
              -f sha="$MAIN_SHA" \
              -f branch="main"
          else
            echo "$MAIN_FORMULA" | gh api --method PUT "repos/shaharia-lab/homebrew-tap/contents/Formula/slackcli.rb" \
              -f message="slackcli ${VERSION_NUM}" \
              -f content="$(echo "$MAIN_FORMULA" | base64 -w0)" \
              -f branch="main"
          fi

          # Create versioned formula if it doesn't exist
          if gh api "repos/shaharia-lab/homebrew-tap/contents/Formula/slackcli@${VERSION_NUM}.rb" --silent 2>/dev/null; then
            echo "Versioned formula slackcli@${VERSION_NUM}.rb already exists, skipping"
          else
            echo "Creating versioned formula slackcli@${VERSION_NUM}.rb..."
            echo "$VERSIONED_FORMULA" | gh api --method PUT "repos/shaharia-lab/homebrew-tap/contents/Formula/slackcli@${VERSION_NUM}.rb" \
              -f message="Add slackcli@${VERSION_NUM} versioned formula" \
              -f content="$(echo "$VERSIONED_FORMULA" | base64 -w0)" \
              -f branch="main"
          fi

          echo "Homebrew formulas updated successfully!"

  # Posts one embed to the Shaharia Lab Discord release channel (#358). Last
  # in the chain so the release assets and the Homebrew formula the message
  # points at already exist. Nothing depends on it and continue-on-error keeps
  # a Discord outage from failing the release: the job shows as failed, the
  # run stays green.
  announce-discord:
    name: Announce on Discord
    needs: [release, update-homebrew]
    # Three gates: not a fork, this run created the release (so a re-run does
    # not post again), and the tag is not a SemVer pre-release.
    if: github.repository == 'shaharia-lab/slackcli' && needs.release.outputs.created == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same pin as the build job. The payload script has no dependencies,
          # so there is no install step.
          bun-version: 1.4.1

      - name: Post release announcement
        env:
          # The webhook URL is a credential: it is only ever read from the
          # environment, never interpolated into this script or printed.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Secrets cannot be read in a job-level `if`, so the check is here.
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK is not set; skipping the Discord announcement"
            exit 0
          fi

          gh release view "$TAG" --json body,url > release.json
          bun run scripts/release-announcement.ts release.json "$TAG" > payload.json

          # curl's own messages are dropped so nothing about the request can
          # reach the log; a network failure reports as HTTP 000. The response
          # goes to a file, not /dev/null: curl 8.5 cannot truncate /dev/null
          # before a retry and gives up with a write error instead of retrying.
          status="$(curl -sS -o response.txt -w '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 15 \
            -H 'Content-Type: application/json' \
            --data @payload.json "$DISCORD_WEBHOOK" 2>/dev/null)" || true

          case "$status" in
            2??) echo "Announced $TAG on Discord (HTTP $status)" ;;
            *)
              echo "::error::Discord announcement failed (HTTP ${status:-000})"
              exit 1
              ;;
          esac
