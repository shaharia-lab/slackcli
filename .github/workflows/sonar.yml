name: SonarQube Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default token. PR decoration comes from the SonarCloud
# GitHub App, not from this token.
permissions:
  contents: read

jobs:
  sonar:
    # Fork PRs and Dependabot PRs get no Actions secrets, so skip them cleanly
    # instead of scanning with an empty SONAR_TOKEN.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for blame data and new-code detection.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: keep CI aligned with release.yml. See release.yml for
          # details on the 1.3.12 macOS codesign regression.
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      # SonarQube Cloud's new-code definition is "Previous version": new code on
      # main is everything since the version last changed, so the version comes
      # from package.json, which each release PR bumps (#306).
      - name: Read project version
        id: version
        run: |
          VERSION="$(jq -r .version package.json)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '${VERSION}' is not a SemVer version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Phase 1 of a phased rollout (#295): the scan never fails the workflow.
      # A failed quality gate or a scanner error shows as an annotation only,
      # so check this step and the SonarCloud dashboard. Dropping
      # continue-on-error is a later phase.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
