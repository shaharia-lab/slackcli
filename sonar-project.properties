# SonarQube Cloud analysis settings, read by .github/workflows/sonar.yml.
# Project: https://sonarcloud.io/project/overview?id=shaharia-lab_slackcli
sonar.organization=shaharia-lab
sonar.projectKey=shaharia-lab_slackcli

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts

# Written by `bun test --coverage --coverage-reporter=lcov` (git-ignored).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
