# SonarQube Cloud analysis settings, read by .github/workflows/sonar.yml.
# Project: https://sonarcloud.io/project/overview?id=shaharia-lab_slackcli
sonar.organization=shaharia-lab
sonar.projectKey=shaharia-lab_slackcli

# Analyse the CLI plus the build script, the website and the workflows, so the
# githubactions:* and web/ rules keep running as they did under Automatic
# Analysis.
sonar.sources=src,scripts,web,.github
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,scripts/**/*.test.ts
# Test files, plus generated or installed web/ output that is never committed
# (see web/.gitignore).
sonar.exclusions=src/**/*.test.ts,scripts/**/*.test.ts,web/node_modules/**,web/dist/**,web/.astro/**,web/src/content/docs/docs/**,web/src/data/release.json,web/src/data/repo.json

# Written by `bun test --coverage --coverage-reporter=lcov` (git-ignored).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage is scoped to the CLI (src/) by decision (#295). web/ and .github/ are
# not measured by `bun test` at all; scripts/ is, but it is build tooling. The
# bootstrap and the type-only module carry no logic worth a coverage target.
sonar.coverage.exclusions=scripts/**,web/**,.github/**,src/index.ts,src/types/**
